# Zkopíruj na customers/{slug}.yml a vyplň. Tajnosti sem nedávej.
# Pravda je DB (hotels + hotel_profiles + hotel_module_settings); YAML je šablona / export.
#   php artisan hotel:provision customers/grand-hotel.yml
#   php artisan hotel:env-files customers/grand-hotel.yml
#   php artisan hotel:modules grand-hotel --enable=recepce,concierge --disable=insights

slug: grand-hotel
name: Grand Hotel Praha

brand:
  app_name: Grand Hotel

domains:
  admin: https://admin.grandhotel.cz
  web: https://app.grandhotel.cz

geo:
  lat: 50.0875
  lng: 14.4213

staff:
  admin_email: recepce@grandhotel.cz

stores:
